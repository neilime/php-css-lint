name: Update CSS Referential

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-css-referential
  cancel-in-progress: false

jobs:
  update-css-referential:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup PHP, with composer and extensions
        uses: hoverkraft-tech/ci-github-php/actions/setup-php@6d0964888074223db9c53b756d004846f3a1569e # 2.0.1
        with:
          ignore-plugins: "false"

      - name: Generate CSS Referential
        run: composer run-script generate-css-referentials

      - name: Validate generated CSS Referential
        run: composer run-script ci

      - name: Create and merge validated CSS Referential update
        uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@a86c260e07b11a7a0ca3b7205bbdba9908230917 # 4.3.0
        with:
          branch: update-css-referential
          bypass-branch-protection: "false"
          add-paths: |
            src/CssLint/Referential
          title: "feat: update CSS Referential"
          body: |
            This pull request updates the CSS referential files in the `src/CssLint/Referential` directory.
          commit-message: "feat: update CSS Referential"
