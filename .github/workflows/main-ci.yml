name: Main - Continuous Integration

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/__shared-ci.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  docs-generate-phpdoc:
    runs-on: ubuntu-latest
    needs: ci
    container: phpdoc/phpdoc:3
    env:
      ARTIFACT_PATH: ./_site
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      artifact-path: ${{ env.ARTIFACT_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📃 Generate PHP documentation
        run: phpdoc run -d ./src -t $ARTIFACT_PATH/phpdoc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-artifact
        with:
          name: docs-phpdoc
          path: ${{ env.ARTIFACT_PATH }}

  docs-publish:
    name: Publish documentation
    needs: docs-generate-phpdoc
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.docs-generate-phpdoc.outputs.artifact-id }}
          path: ${{ needs.docs-generate-phpdoc.outputs.artifact-path }}

      - uses: hoverkraft-tech/ci-github-publish/actions/deploy/jekyll@218a19141dd9c88bd74b0ad28f1facb4c3568fbb # 1.0.0
        id: build
        with:
          site-path: ${{ needs.docs-generate-phpdoc.outputs.artifact-path }}
          pages: |
            ./docs/*.md

      - uses: hoverkraft-tech/ci-github-publish/actions/deploy/github-pages@218a19141dd9c88bd74b0ad28f1facb4c3568fbb # 1.0.0
        id: deployment
        with:
          build-path: ${{ steps.build.outputs.build-path }}
