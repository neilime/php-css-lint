name: Shared - Continuous Integration for common tasks
on:
  workflow_call:
    outputs:
      documentation-artifact-id:
        description: Generated PHP API documentation.
        value: ${{ jobs.documentation.outputs.artifact-id }}
permissions: {}
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@b81aa7b46f6b7a18ff1d9582c918cc1cc8296b98 # 2.0.0
    permissions:
      contents: read
      id-token: write
    with:
      ignore-plugins: false
      test: '{"coverage":"codecov","cache":".cache"}'
      package: |
        {
          "tests": "php-css-lint '.example { color: red; }'\nif php-css-lint '.example { unknown-property: invalid; }'; then\n  echo 'Invalid CSS unexpectedly passed validation.' >&2\n  exit 1\nfi"
        }
  documentation:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/documentation.yml@b81aa7b46f6b7a18ff1d9582c918cc1cc8296b98 # 2.0.0
    permissions:
      contents: read
